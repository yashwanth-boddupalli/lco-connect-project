<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — LCO Connect</title>
  <meta name="description"
    content="Reset your LCO Connect account password. Set a new password and sign in again.">
  <meta name="theme-color" content="#0B7A6E">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap"
    rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/super-admin.css">
</head>

<body class="sa-login-page">

  <!-- Toast container -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- ═══════════════════════════════════════════
     RESET PASSWORD FORM
     ═══════════════════════════════════════════ -->
  <main class="sa-login-main">
    <div class="sa-login-card" style="max-width: 460px;">

      <!-- Brand -->
      <div class="sa-login-brand">
        <a href="../index.html" class="brand" aria-label="LCO Connect — Home">
          <span class="brand-mark" aria-hidden="true"></span>LCO Connect
        </a>
      </div>

      <!-- Reset form -->
      <form id="resetForm" novalidate autocomplete="off">
        <h1 id="resetHeading">Reset Password</h1>
        <p class="sa-login-desc" id="resetSubtext">Enter a new password for your account.</p>

        <!-- Dynamic status notice banner -->
        <div id="resetNotice" style="display:none; padding: 12px 16px; background: rgba(11,122,110,0.1); border-left: 4px solid #0B7A6E; border-radius: 6px; font-size: 13px; margin-bottom: 20px; color: #0B7A6E;">
          <strong>Link verified!</strong> Set your new password below.
        </div>

        <div class="sa-form-group">
          <label for="resetPassword">New Password *</label>
          <div class="sa-password-wrap">
            <input type="password" id="resetPassword" name="password" placeholder="Minimum 8 characters" required minlength="8">
          </div>
          <div class="sa-field-error" id="resetPassword-error">Password must be at least 8 characters</div>
        </div>

        <div class="sa-form-group">
          <label for="resetConfirmPassword">Confirm New Password *</label>
          <div class="sa-password-wrap">
            <input type="password" id="resetConfirmPassword" name="confirmPassword" placeholder="Re-enter new password" required>
          </div>
          <div class="sa-field-error" id="resetConfirmPassword-error">Passwords do not match</div>
        </div>

        <button type="submit" class="sa-login-btn" id="resetBtn" disabled>
          Set New Password
        </button>

        <div class="sa-login-footer-text">
          Remembered it? <a href="login.html">Sign In →</a>
          <div style="margin-top: 8px;"><a href="../index.html">← Back to LCO Connect</a></div>
        </div>
      </form>

    </div>

    <!-- Background decoration -->
    <div class="sa-login-bg" aria-hidden="true">
      <div class="sa-bg-circle sa-bg-1"></div>
      <div class="sa-bg-circle sa-bg-2"></div>
      <div class="sa-bg-circle sa-bg-3"></div>
    </div>
  </main>


  <!-- Capture the untouched URL hash before Supabase consumes/clears it -->
  <script>window.__lcoInitialHash = window.location.hash || '';</script>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Shared Auth Module -->
  <script src="../js/auth.js"></script>

  <script>
    (function () {
      'use strict';

      var sb = LCOAuth.getClient();
      var form = document.getElementById('resetForm');
      var passwordInput = document.getElementById('resetPassword');
      var confirmPwInput = document.getElementById('resetConfirmPassword');
      var resetBtn = document.getElementById('resetBtn');
      var noticeEl = document.getElementById('resetNotice');
      var subtextEl = document.getElementById('resetSubtext');

      var hasRecoverySession = false;

      function applyRecoverySession(session) {
        if (!session || !session.user) return;
        hasRecoverySession = true;
        resetBtn.disabled = false;
        noticeEl.style.display = 'block';
      }

      function showLinkError() {
        hasRecoverySession = false;
        resetBtn.disabled = true;
        noticeEl.style.display = 'block';
        noticeEl.style.background = 'rgba(220,38,38,0.08)';
        noticeEl.style.borderLeftColor = '#DC2626';
        noticeEl.style.color = '#B91C1C';
        noticeEl.innerHTML = '<strong>This reset link has expired or was already used.</strong> Go back to the <a href="login.html" style="color:#B91C1C; text-decoration: underline;">login page</a> and request a new one.';
        if (subtextEl) subtextEl.textContent = 'Password reset links can be used only once.';
      }

      // Supabase returns link errors in the URL hash
      // (#error=access_denied&error_code=otp_expired&...). Parse the
      // untouched hash captured before the Supabase client was created.
      var initialHash = window.__lcoInitialHash || window.location.hash || '';
      var hashParams = new URLSearchParams(initialHash.replace(/^#/, ''));
      var hashError = hashParams.get('error') || hashParams.get('error_code');
      // A genuine reset-link arrival carries an access_token; a session
      // without one is only a persisted login, not a recovery session.
      var arrivedViaLink = initialHash.indexOf('access_token') !== -1;

      function showPersistedSessionState() {
        if (hasRecoverySession) return;
        resetBtn.disabled = true;
        if (subtextEl) {
          subtextEl.textContent = 'Open the reset link from your email to continue.';
        }
      }

      if (hashError) {
        showLinkError();
      } else if (sb) {
        sb.auth.getSession().then(function (res) {
          if (res.data && res.data.session) {
            if (arrivedViaLink) {
              applyRecoverySession(res.data.session);
            } else {
              showPersistedSessionState();
            }
          } else if (!hasRecoverySession) {
            resetBtn.disabled = true;
            if (subtextEl) {
              subtextEl.textContent = 'Open the password reset link from your email to continue.';
            }
          }
        });

        sb.auth.onAuthStateChange(function (event, session) {
          if (!session) return;
          if (event === 'PASSWORD_RECOVERY') {
            applyRecoverySession(session);
          } else if (event === 'SIGNED_IN' && arrivedViaLink) {
            applyRecoverySession(session);
          } else if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION') {
            showPersistedSessionState();
          }
        });
      } else {
        resetBtn.disabled = true;
      }

      // Clear errors on input
      [passwordInput, confirmPwInput].forEach(function (input) {
        input.addEventListener('input', function () {
          input.classList.remove('error');
          var errEl = document.getElementById(input.id + '-error');
          if (errEl) errEl.classList.remove('visible');
        });
      });

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var valid = true;

        var password = passwordInput.value;
        var confirmPw = confirmPwInput.value;

        if (!password || password.length < 8) {
          passwordInput.classList.add('error');
          document.getElementById('resetPassword-error').classList.add('visible');
          valid = false;
        }

        if (password !== confirmPw) {
          confirmPwInput.classList.add('error');
          document.getElementById('resetConfirmPassword-error').classList.add('visible');
          valid = false;
        }

        if (!valid) return;

        resetBtn.disabled = true;
        resetBtn.innerHTML = '<span class="sa-spinner"></span> Updating password…';

        try {
          if (!sb) throw new Error('Connection unavailable. Please refresh and use your reset link.');

          var sessionRes = await sb.auth.getSession();
          var currentSession = sessionRes.data ? sessionRes.data.session : null;

          if (!currentSession || !currentSession.user) {
            throw new Error('Please open the password reset link from your email before setting a new password.');
          }

          var updateRes = await sb.auth.updateUser({ password: password });
          if (updateRes.error) throw updateRes.error;

          // End the recovery session so the user signs in fresh with the
          // new password — this also proves the new password works.
          await sb.auth.signOut();

          showToast('Password updated successfully! Redirecting to login…', 'success');

          setTimeout(function () {
            window.location.href = 'login.html';
          }, 1200);

        } catch (err) {
          console.error('Password reset failed:', err);
          resetBtn.disabled = false;
          resetBtn.innerHTML = 'Set New Password';
          showToast(err.message || 'Could not update password. Please request a new reset link.', 'error');
        }
      });

      function showToast(message, type) {
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        toast.className = 'sa-toast ' + (type || '');
        var icon = type === 'error' ? '⚠️' : type === 'success' ? '✓' : '💬';
        toast.innerHTML = '<span class="sa-toast-icon">' + icon + '</span>' + escapeHtml(message);
        container.appendChild(toast);
        setTimeout(function () {
          toast.classList.add('removing');
          setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 300);
        }, 5000);
      }

      function escapeHtml(str) {
        var d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
      }
    })();
  </script>

</body>

</html>
